[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-translate"
version = "0.1.0"
description = "AI-assisted Wikipedia article translation tool producing drafts for human review"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Chung-Hao Lee" }]
keywords = ["wikipedia", "translation", "llm", "ai"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "Wikipedia-API>=0.6.0",
    "requests>=2.31",
    "click>=8.1",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
wiki-translate = "wiki_translate.cli:main"

[project.urls]
Homepage = "https://github.com/lch99310/wikipedia-translation"
Issues = "https://github.com/lch99310/wikipedia-translation/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
